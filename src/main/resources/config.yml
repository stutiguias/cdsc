# don't change this
configversion: 10
#DataBase
DataBase:
  # You need to choose if you will use SQLite or Mysql ( default is SQLite )
  Type: SQLite
#MySQL config if you will use mysql ( set type to mysql )
MySQL:
  Host: localhost
  Username: root
  Password: change_this
  Port: '3306'
  Database: minecraft
# How Many Life For Each Core
CoreLife: 20
# What Material is the core 
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
CoreBlock: 'OBSIDIAN'
# Don't drop item on kill during event
# The item will auto-save and 
# add back after player re-spawn
# if player inv is full the item will
# be lost forever
Dontdropduringevent: true
# Don't die during event
# will don't let player die
# anytime player will die 
# he will be teleport to exit
# point and get full health again
Dontdieduringevent: false
# Defaults flags set to area
DefaultFlags:
    ClanOwnerCanBreakArea: false
    ClanOwnerCanPlaceArea: false
# Auto event starts the event for all castles every IntervalMinutes
# and ends it automatically after DurationMinutes
AutoEvent:
  Enabled: false
  IntervalMinutes: 60
  DurationMinutes: 15
MiniGame:
  # Keep false to preserve the classic CDSC behavior.
  Enabled: false
  DefaultClass: warrior
  Classes:
    warrior:
      Display: "&cWarrior"
      Items:
        - "IRON_SWORD:1"
        - "SHIELD:1"
      Effects: []
    archer:
      Display: "&aArcher"
      Items:
        - "BOW:1"
        - "ARROW:32"
      Effects: []
    tank:
      Display: "&9Tank"
      Items:
        - "IRON_SWORD:1"
        - "IRON_CHESTPLATE:1"
      Effects:
        - "DAMAGE_RESISTANCE:1"
